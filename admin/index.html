<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Quản trị nội dung — Cổng KCN/CCN Lào Cai</title>
  <link rel="icon" type="image/png" href="/pwa-icon-192.png" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #admin-notice {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: linear-gradient(90deg, #0f3460, #16213e);
      color: #fff; padding: 8px 16px; font-size: 0.86rem; line-height: 1.4;
      box-shadow: 0 2px 8px rgba(15,52,96,0.3);
      display: flex; align-items: center; justify-content: center; gap: 12px;
    }
    #admin-notice b { color: #fbbf24; }
    #admin-notice a {
      color: #fff; text-decoration: underline; font-weight: 600;
    }
    #admin-notice .close-notice {
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
      font-size: 1rem; line-height: 1;
    }
    body.notice-shown { padding-top: 44px; }
  </style>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<div id="admin-notice">
  <span>🔒 <b>Khu vực quản trị nội bộ.</b> Vui lòng tuân thủ <a href="QUY-CHE-QUAN-TRI.md" target="_blank">Quy chế Quản trị Tài khoản</a> · Mọi thao tác được ghi log + audit.</span>
  <button class="close-notice" onclick="document.body.classList.remove('notice-shown'); this.parentElement.style.display='none';" aria-label="Đóng">×</button>
</div>
<script>document.body.classList.add('notice-shown');</script>

<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
