# SOÁT DỰ THẢO VĂN BẢN (Bạn chốt 04/9/2026).
# Bạn thả tệp .docx vào thư mục du-thao/ trên GitHub (kéo thả trên trình duyệt là xong). Máy tự:
#   1. Rút mọi văn bản được viện dẫn trong dự thảo.
#   2. Đối chiếu sổ đăng ký văn bản của bộ plugin: văn bản nào đã bị sửa đổi, thay thế, chưa tới hiệu lực.
#   3. Soi mâu thuẫn giữa Tờ trình và dự thảo Quyết định, kiểm thể thức cơ bản.
#   4. Ghi báo cáo vào du-thao/<tên tệp>/bao-cao-soat.md rồi mở issue mời Claude vào soát nội dung.
# Máy KHÔNG tự sửa văn bản: phần đọc hiểu và chốt nội dung do Claude làm.

name: Soat du thao van ban
on:
  push:
    paths: ['du-thao/**.docx']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  soat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện
        run: pip install python-docx
      - name: Soát các dự thảo chưa có báo cáo
        id: soat
        run: |
          moi=""
          for f in du-thao/*.docx; do
            [ -e "$f" ] || continue
            thu_muc="du-thao/$(basename "${f%.docx}")"
            # soát lại khi chưa có báo cáo, hoặc tệp dự thảo mới hơn báo cáo
            if [ ! -f "$thu_muc/bao-cao-soat.md" ] || [ "$f" -nt "$thu_muc/bao-cao-soat.md" ]; then
              echo "== Soát $f"
              python scripts/soat_du_thao.py "$f" && moi="$moi$f;"
            fi
          done
          echo "moi=$moi" >> "$GITHUB_OUTPUT"
      - name: Lưu báo cáo vào kho
        if: steps.soat.outputs.moi != ''
        run: |
          git config user.name "soat-bot"
          git config user.email "soat-bot@users.noreply.github.com"
          git add -A du-thao/
          if git diff --cached --quiet; then echo "Không có gì mới"; exit 0; fi
          git commit -m "Soát dự thảo: thêm báo cáo cho $(echo '${{ steps.soat.outputs.moi }}' | tr ';' ' ')"
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
      - name: Mở issue mời Claude soát nội dung
        if: steps.soat.outputs.moi != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=';' read -ra ds <<< "${{ steps.soat.outputs.moi }}"
          for f in "${ds[@]}"; do
            [ -n "$f" ] || continue
            ten=$(basename "${f%.docx}")
            bc="du-thao/$ten/bao-cao-soat.md"
            {
              echo "Máy đã soát phần cơ học cho dự thảo **$ten**."
              echo
              echo "- Tệp dự thảo: \`$f\`"
              echo "- Báo cáo máy soát: \`$bc\`"
              echo
              echo "Việc còn lại của Claude: đối chiếu nội dung trích dẫn với bản gốc, kiểm tra mốc hiệu lực"
              echo "và quy định chuyển tiếp, kiểm tra số liệu và tên người theo dữ liệu của Sở, rồi trả lại"
              echo "bản đã sửa có bôi đỏ kèm bảng giải trình."
              echo
              echo "---"
              echo
              head -c 40000 "$bc"
            } > /tmp/issue.md
            gh issue create --title "Soát dự thảo: $ten" --body-file /tmp/issue.md \
              || echo "::warning::Không mở được issue cho $ten"
          done
